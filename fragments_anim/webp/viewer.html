<!doctype html><html><head><meta charset="utf-8"><title>L'Éclat — fragments animés</title>
<style>
  :root{--laiton:#cfa15a;--voile:#e7ddc9}
  body{margin:0;background:#0c0a08;color:var(--voile);font-family:Georgia,serif;
       display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 16px}
  h1{font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--laiton);font-weight:400}
  .row{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;margin-top:24px}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
  img{width:340px;height:340px;border:1px solid rgba(207,161,90,.25);border-radius:2px;
      box-shadow:0 24px 60px -30px rgba(0,0,0,.8)}
  figcaption{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#9a8f78}
  p.note{margin-top:32px;font-size:12px;color:#7c7261;font-style:italic;max-width:520px;text-align:center}
</style></head><body>
  <h1>L'Éclat — Fragments animés (boucle)</h1>
  <div class="row">
    <figure><img src="forge.webp" alt="forge"><figcaption>III · Forge</figcaption></figure>
    <figure><img src="eveil.webp" alt="eveil"><figcaption>I · Éveil</figcaption></figure>
  </div>
  <p class="note">La faille laiton se trace en diagonale, tient, puis s'efface — la caméra respire. Boucle 2 s. Les 8 autres fragments arrivent.</p>
</body></html>
